<svg width="100%" viewBox="0 0 680 190" role="img" xmlns="http://www.w3.org/2000/svg" style="">
	<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
		Sudoku-Zelle mit verbreitertem weißem Rand
	</title>
	<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
		Eine weiße Fläche von 150 mal 150 Pixeln mit einer 90 Pixel großen Sudoku-Zelle in der Mitte, umgeben von 30 Pixeln Rand. Vier hellblaue Innenlinien teilen die Zelle in ein 3x3-Raster, in sechs Feldern stehen schwarze Ziffern.
	</desc>
	<rect x="265" y="20" width="150" height="150" fill="#ffffff" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" />
